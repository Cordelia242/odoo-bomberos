name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Validate
        run: |
          python -m compileall -q scripts addons
          python scripts/validate_addons.py
          python -m pytest -q
          find deploy -maxdepth 1 -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Build production image
        run: |
          docker build --build-arg ODOO_BASE_IMAGE=odoo:19.0-20260817 -f docker/Dockerfile .
