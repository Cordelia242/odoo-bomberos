name: odoo-bomberos

services:
  odoo:
    image: ${ODOO_IMAGE:?ODOO_IMAGE must be set}
    restart: unless-stopped
    environment:
      HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set}
      PORT: "${POSTGRES_PORT:-5432}"
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./runtime/odoo.conf:/etc/odoo/odoo.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5).read(1)\""]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s
    networks:
      - home-network

volumes:
  odoo-data:

networks:
  home-network:
    external: true
